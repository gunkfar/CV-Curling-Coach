services:
  db:
    image: postgres:18
    env_file: .env
    # expose:
    #   - '5432'
    volumes:
      - curling-coach:/var/lib/postgresql 
      # /data
      - ./src/init_data:/docker-entrypoint-initdb.d
  web:
    image: node:lts
    # user: 'node'
    working_dir: /repository
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      - db
    ports:
      - '3000:3000'
    volumes:
      - ./:/repository
      - web_node_modules:/repository/node_modules
    command: sh -c 'npm install && npm start' 
volumes:
  curling-coach:
  web_node_modules: